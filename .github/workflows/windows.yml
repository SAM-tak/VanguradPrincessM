name: Windows distribution

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11.9'
          architecture: x64
          cache: pip
          cache-dependency-path: tools/fm2k_convert/requirements*.txt
      - name: Download pinned engine release
        run: ./tools/download-engine.ps1
      - name: Build game and standalone asset builder
        run: ./tools/dist.ps1 -Lovec build/release-engine/compiler/lovec.exe -ShippingDirectory build/release-engine/runtime
      - name: Test asset builder and package contents
        run: |
          & build/asset-builder-venv/Scripts/python.exe -m unittest discover -s tests -p test_build_assets.py
          if ($LASTEXITCODE -ne 0) { throw 'Asset builder tests failed' }
          & build/asset-builder-venv/Scripts/python.exe -m unittest discover -s tests -p test_extract_original.py
          if ($LASTEXITCODE -ne 0) { throw 'Archive tests failed' }
          & tools/check-distribution.ps1
      - name: Upload Windows distribution
        uses: actions/upload-artifact@v7.0.2
        with:
          name: VanguardPrincess-windows-x64
          path: dist/VanguardPrincess/
          if-no-files-found: error
      - name: Upload engine check logs on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-engine-check-logs
          path: build/engine-check/**/*.log
          if-no-files-found: ignore
